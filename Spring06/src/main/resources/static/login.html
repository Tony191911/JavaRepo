<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Insert title here</title>
	</head>
	<body>
		<h1>Login Page</h1>
		<hr />
		<form id="loginForm">
			Email: <input id="email" required="required" />
			Password: <input id="passwd" type="password" required="required" />
			<input type="submit" value="login" />
		</form>
		<hr />
		<span id="mesg"></span>
		
		<script type="text/javascript">
			document.getElementById("loginForm").addEventListener("submit",async function(e){
				e.preventDefault();
				let email = document.getElementById("email").value.trim();
				let passwd = document.getElementById("passwd").value.trim();
				
				let resp = await fetch("/api/login", {
					method: "POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify({
						"email": email,
						"passwd": passwd
					})
				})
				
				let data = await resp.json;
				console.log(data);
			
			});
		</script>
	</body>
</html>
