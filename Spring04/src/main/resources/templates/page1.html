<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Insert title here</title>
	</head>
	<body>
		<h1>Page1</h1>
		<hr />
		<h2 th:text="${companyName}">公司名稱</h2>
		<div th:text="'Welcome, ' + ${userName}">Welcome, 使用者</div>
		<div th:text="${'Welcome2, ' + userName}">Welcome, 使用者</div>
		<hr />
		<div th:text="${user.id}">ID</div>
		<div th:text="${user.name}">User Name</div>
		<div th:text="${user.age >= 18 ? '已成年' : '未成年'}">是否成年</div>
		<div th:text="${user.gender ? '男生' : '女性'}">性別</div>
		<div th:text="${user}">toString</div>
		<div>目前時間:<span th:text="${now}"></span></div>
	</body>
</html>
